name: Release APK

# Builds signed Android APKs for pilot landlords.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.
#
# Repository settings → Secrets and variables → Actions:
#   Variables: API_BASE_URL (e.g. https://api.example.et/api/v1), FEEDBACK_URL (optional, the pilot Telegram group)
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "::error::Set the API_BASE_URL repository variable to the server's https URL (…/api/v1)."; exit 1
          fi
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret (see README, Release build)."; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - run: flutter pub get
      - run: flutter test

      # Split per ABI keeps each APK small for low-end phones and slow data.
      - name: Build
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=FEEDBACK_URL=${{ vars.FEEDBACK_URL }}
          ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: kiray-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
